[package]
name = "warroom-launcher"
version = "0.1.0"
edition = "2021"
description = "Launcher for online games of the Zero Hour community build"
license = "GPL-3.0-or-later"

[lib]
name = "warroom_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
