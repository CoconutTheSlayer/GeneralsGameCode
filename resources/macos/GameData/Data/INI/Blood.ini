;//////////////////////////////////////////////////////////////////////////////
; Blood.ini - blood effects for infantry, added by the macOS fork.
; Loaded after ParticleSystem.ini and FXList.ini. The engine plays
; FX_InfantryBlood when infantry dies, FX_InfantryBloodHeavy when it is run over
; or blown up, and FX_InfantryBloodHit when it is hit. Blood in Options.ini
; (High, Low or Off) controls them.
;//////////////////////////////////////////////////////////////////////////////

